<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hotovost</title>
<link rel="manifest" href="manifest.json">
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<meta name="theme-color" content="#1565C0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hotovost">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1565C0;--blue2:#1E88E5;--green:#2E7D32;--red:#C62828;--bg:#f0f2f5;--card:#fff;--border:#e0e0e0;--text:#1a1a1a;--muted:#888;--r:14px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1565C0,#1E88E5);color:#fff;padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:19px;font-weight:700}
.sync{font-size:11px;opacity:.9;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#fff6}
.dot.ok{background:#69f0ae}.dot.err{background:#ff5252}
.nav{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:49}
.nav button{flex:1;padding:9px 1px;border:none;background:none;cursor:pointer;font-size:10.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;transition:.15s}
.nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{padding:14px 12px 100px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.card-title{font-weight:700;font-size:15px;margin-bottom:12px}
.sum-grid{display:flex;justify-content:space-between}
.sum-col{text-align:center}
.sum-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.sum-val{font-size:17px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f5f5f5}
.acc-row:last-child{border-bottom:none}
.acc-dot{width:11px;height:11px;border-radius:50%;margin-right:9px;flex-shrink:0}
.acc-bal{font-weight:700;font-size:16px}
.chart-wrap{height:160px;position:relative}
.cat-row{margin-bottom:10px}
.cat-row-top{display:flex;justify-content:space-between;margin-bottom:3px;font-size:13px}
.cat-bar-bg{background:#f0f0f0;border-radius:4px;height:6px}
.cat-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.tx-item{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px #0001}
.tx-icon{font-size:22px;margin-right:10px;flex-shrink:0}
.tx-name{font-weight:600;font-size:14px}
.tx-sub{font-size:12px;color:var(--muted)}
.tx-amount{font-weight:700;font-size:15px;white-space:nowrap;margin-left:8px}
.empty{text-align:center;color:var(--muted);margin-top:60px;font-size:15px;line-height:1.7}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cat-card{background:#fff;border-radius:12px;padding:14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px #0001;position:relative}
.cat-card-icon{font-size:22px}
.cat-card-name{font-weight:600;font-size:13px}
.cat-accent{width:30px;height:3px;border-radius:2px;margin-top:3px}
.del-btn{position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;font-size:14px;color:#ccc;padding:2px 4px;line-height:1}
.del-btn:hover{color:var(--red)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f5f5f5}
.setting-row:last-child{border-bottom:none}
.setting-input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px;width:130px;text-align:right;color:var(--text)}
.fab{position:fixed;bottom:24px;right:50%;transform:translateX(195px);width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;border:none;cursor:pointer;box-shadow:0 4px 16px #1565C055;display:flex;align-items:center;justify-content:center;z-index:100}
.fab:active{opacity:.85}
.overlay{position:fixed;inset:0;background:#0008;z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:430px;margin:0 auto;transform:translateY(40px);transition:transform .25s}
.overlay.open .modal{transform:translateY(0)}
.modal-title{font-weight:700;font-size:18px;margin-bottom:16px}
.type-row{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;background:#f0f0f0;color:#555;transition:.15s}
.type-btn.vydaj.active{background:#EF5350;color:#fff}
.type-btn.prijem.active{background:#43A047;color:#fff}
.modal input,.modal select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;margin-bottom:10px;background:#fff;color:var(--text)}
.modal input[type=number]{font-size:20px;font-weight:700}
.modal-btns{display:flex;gap:10px;margin-top:6px}
.btn-cancel{flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);background:#f5f5f5;font-weight:700;cursor:pointer;font-size:15px}
.btn-save{flex:2;padding:13px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.btn-add{width:100%;padding:12px;border-radius:12px;border:2px dashed var(--blue);background:none;color:var(--blue);font-weight:700;cursor:pointer;font-size:14px;margin-top:4px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1 id="hdr-title">Přehled</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="sync"><div class="dot" id="dot"></div><span id="sync-lbl">spojuji...</span></div>
    <div style="font-size:12px;opacity:.8" id="hdr-month"></div>
  </div>
</div>

<nav class="nav">
  <button class="active" onclick="go('prehled',this)">📊 Přehled</button>
  <button onclick="go('ucty',this)">🏦 Účty</button>
  <button onclick="go('transakce',this)">📋 Záznamy</button>
  <button onclick="go('kategorie',this)">🏷️ Kategorie</button>
  <button onclick="go('nastaveni',this)">⚙️ Nastavení</button>
</nav>

<div class="content" id="content">
  <div class="loading"><div class="spinner"></div><br>Načítám data...</div>
</div>

<div class="toast" id="toast"></div>
<button class="fab" id="fab" onclick="openAdd()">+</button>

<!-- ADD/EDIT TX -->
<div class="overlay" id="m-tx">
  <div class="modal">
    <div class="modal-title" id="m-tx-title">Nová transakce</div>
    <input type="hidden" id="f-edit-id">
    <input type="hidden" id="f-edit-old-acc">
    <input type="hidden" id="f-edit-old-amt">
    <input type="hidden" id="f-edit-old-type">
    <div class="type-row">
      <button class="type-btn vydaj active" id="btn-v" onclick="setType('vydaj')">Výdaj 💸</button>
      <button class="type-btn prijem" id="btn-p" onclick="setType('prijem')">Příjem 💰</button>
    </div>
    <input type="number" id="f-amt" placeholder="Částka (Kč)" inputmode="decimal" step="0.01">
    <select id="f-acc"></select>
    <select id="f-cat"></select>
    <input type="date" id="f-date">
    <input type="text" id="f-note" placeholder="Poznámka (nepovinné)">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeM('m-tx')">Zrušit</button>
      <button class="btn-save" id="btn-save-tx" onclick="saveTx()">Uložit</button>
    </div>
  </div>
</div>

<!-- PIE CHART MODAL -->
<div class="overlay" id="m-pie">
  <div class="modal" style="padding-bottom:30px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="modal-title" style="margin:0" id="pie-title">Výdaje podle kategorií</div>
      <button onclick="closeM('m-pie')" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)">✕</button>
    </div>
    <div style="height:220px;position:relative;width:100%"><canvas id="pieChart" style="max-height:220px"></canvas></div>
    <div id="pie-legend" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
  </div>
</div>

<!-- ADD CAT -->
<div class="overlay" id="m-cat">
  <div class="modal">
    <div class="modal-title">Nová kategorie</div>
    <input type="text" id="c-icon" placeholder="Emoji (např. 🏠)" style="text-align:center;font-size:22px">
    <input type="text" id="c-name" placeholder="Název kategorie">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeM('m-cat')">Zrušit</button>
      <button class="btn-save" onclick="saveCat()">Přidat</button>
    </div>
  </div>
</div>

<!-- ADD ACC -->
<div class="overlay" id="m-acc">
  <div class="modal">
    <div class="modal-title">Nový účet</div>
    <input type="text" id="a-name" placeholder="Jméno (např. Tomáš)">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeM('m-acc')">Zrušit</button>
      <button class="btn-save" id="btn-save-acc" onclick="saveAcc()">Přidat</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtsIlc1Zwy4mXD4FF0VmjpLIzlG-YlFrU",
  authDomain: "hotovost-54924.firebaseapp.com",
  projectId: "hotovost-54924",
  storageBucket: "hotovost-54924.firebasestorage.app",
  messagingSenderId: "426740716272",
  appId: "1:426740716272:web:2c043da475f9f820eb6835"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let accounts=[], categories=[], transactions=[];
let view='prehled', txType='vydaj', chart=null, ready=false;
const _now=new Date();
let selMonth=_now.getMonth(), selYear=_now.getFullYear();
const MONTHS=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const ACC_COLORS=['#1976D2','#C2185B','#388E3C','#F57C00','#5C6BC0','#00838F'];
const CAT_COLORS=['#4CAF50','#9C27B0','#2196F3','#FF5722','#F44336','#FF9800','#607D8B','#E91E63','#00BCD4','#795548'];
function fmt(n){return Number(n).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč';}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

async function seed(){
  // Použij transakci aby seed proběhl jen jednou i když appku otevřou oba najednou
  const ref = db.collection('_meta').doc('seeded');
  try {
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      if(doc.exists) return; // už oseedováno
      tx.set(ref,{at: firebase.firestore.FieldValue.serverTimestamp()});
    });
    // Jsme první – přidej výchozí data
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    const aSnap=await db.collection('accounts').get();
    if(aSnap.empty){
      await db.collection('accounts').add({name:'Já',color:'#1976D2',balance:0,createdAt:ts});
      await db.collection('accounts').add({name:'Manželka',color:'#C2185B',balance:0,createdAt:ts});
    }
    const cSnap=await db.collection('categories').get();
    if(cSnap.empty){
      const defs=[{name:'Potraviny',icon:'🛒',color:'#4CAF50'},{name:'Oblečení',icon:'👗',color:'#9C27B0'},{name:'Doprava',icon:'🚗',color:'#2196F3'},{name:'Restaurace',icon:'🍽️',color:'#FF5722'},{name:'Zdraví',icon:'💊',color:'#F44336'},{name:'Zábava',icon:'🎬',color:'#FF9800'},{name:'Ostatní',icon:'📦',color:'#607D8B'}];
      for(const d of defs) await db.collection('categories').add({...d,createdAt:ts});
    }
  } catch(e){ /* seed už proběhl nebo chyba – ok */ }
}

function init(){
  let loaded={a:false,c:false,t:false};
  // záchranný timeout – po 8 sekundách zobraz co máme
  setTimeout(()=>{
    if(!ready){
      ready=true;
      document.getElementById('dot').className='dot err';
      document.getElementById('sync-lbl').textContent='offline';
      render();
    }
  },8000);
  function checkReady(){
    if(loaded.a&&loaded.c&&loaded.t&&!ready){
      ready=true;
      document.getElementById('dot').className='dot ok';
      document.getElementById('sync-lbl').textContent='online';
      render();
    }
  }
  db.collection('accounts').orderBy('createdAt').onSnapshot(s=>{
    accounts=s.docs.map(d=>({id:d.id,...d.data()}));
    loaded.a=true; if(ready)render(); else checkReady();
  },e=>{console.warn('accounts',e);loaded.a=true;checkReady();});
  db.collection('categories').orderBy('createdAt').onSnapshot(s=>{
    categories=s.docs.map(d=>({id:d.id,...d.data()}));
    loaded.c=true; if(ready)render(); else checkReady();
  },e=>{console.warn('categories',e);loaded.c=true;checkReady();});
  db.collection('transactions').orderBy('date','desc').onSnapshot(s=>{
    transactions=s.docs.map(d=>({id:d.id,...d.data()}));
    loaded.t=true; if(ready)render(); else checkReady();
  },e=>{
    console.warn('transactions',e);
    document.getElementById('dot').className='dot err';
    document.getElementById('sync-lbl').textContent='offline';
    loaded.t=true;checkReady();
  });
  seed();
}

function goUcty(){
  const btn=document.querySelectorAll('.nav button')[1];
  go('ucty',btn);
  window.scrollTo(0,0);
}

function go(v,btn){
  view=v;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const T={prehled:'Přehled',ucty:'Účty',transakce:'Záznamy',kategorie:'Kategorie',nastaveni:'Nastavení'};
  document.getElementById('hdr-title').textContent=T[v];
  document.getElementById('fab').style.display=v==='nastaveni'?'none':'flex';
  render();
}
function render(){
  const el=document.getElementById('content');
  if(view==='prehled'){el.innerHTML=vPrehled();renderChart();}
  else if(view==='ucty')el.innerHTML=vUcty();
  else if(view==='transakce')el.innerHTML=vTx();
  else if(view==='kategorie')el.innerHTML=vKat();
  else if(view==='nastaveni')el.innerHTML=vNastaveni();
}

function changeMonth(dir){
  selMonth+=dir;
  if(selMonth>11){selMonth=0;selYear++;}
  if(selMonth<0){selMonth=11;selYear--;}
  render();
}

function vPrehled(){
  const m=selMonth, y=selYear;
  const now=new Date();
  const isCurrent=(m===now.getMonth()&&y===now.getFullYear());
  const mTx=transactions.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y;});
  const inc=mTx.filter(t=>t.type==='prijem').reduce((s,t)=>s+t.amount,0);
  const exp=mTx.filter(t=>t.type==='vydaj').reduce((s,t)=>s+t.amount,0);
  const tot=inc-exp;
  const totalBal=accounts.reduce((s,a)=>s+(a.balance||0),0);
  const catMap={};
  mTx.filter(t=>t.type==='vydaj').forEach(t=>{catMap[t.categoryId]=(catMap[t.categoryId]||0)+t.amount;});
  const catRows=Object.entries(catMap).map(([id,sum])=>({cat:categories.find(c=>c.id===id),sum})).filter(r=>r.cat).sort((a,b)=>b.sum-a.sum);

  // počet dní v měsíci
  const daysInMonth=new Date(y,m+1,0).getDate();

  let h=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button onclick="changeMonth(-1)" style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:18px;cursor:pointer;box-shadow:0 1px 4px #0001">‹</button>
    <div style="font-weight:700;font-size:17px">${MONTHS[m]} ${y}</div>
    <button onclick="changeMonth(1)" ${isCurrent?'disabled style="opacity:.3;cursor:default"':''} style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:18px;cursor:pointer;box-shadow:0 1px 4px #0001">›</button>
  </div>

  <div class="card">
    <div class="card-title">Shrnutí</div>
    <div class="sum-grid">
      <div class="sum-col"><div class="sum-label">Příjmy</div><div class="sum-val pos">+${fmt(inc)}</div></div>
      <div class="sum-col"><div class="sum-label">Výdaje</div><div class="sum-val neg">−${fmt(exp)}</div></div>
      <div class="sum-col"><div class="sum-label">Bilance</div><div class="sum-val ${tot>=0?'pos':'neg'}">${tot>=0?'+':''}${fmt(tot)}</div></div>
    </div>
  </div>`;

  h+=`<div class="card">
    <div class="card-title">Účty</div>
    ${accounts.map(a=>{
      const aInc=mTx.filter(t=>t.type==='prijem'&&t.accountId===a.id).reduce((s,t)=>s+t.amount,0);
      const aExp=mTx.filter(t=>t.type==='vydaj'&&t.accountId===a.id).reduce((s,t)=>s+t.amount,0);
      const aBil=aInc-aExp;
      return`<div onclick="goUcty()" style="padding:10px 0;border-bottom:1px solid #f5f5f5;cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:11px;height:11px;border-radius:50%;background:${a.color}"></div>
            <span style="font-weight:700;font-size:15px">${a.name}</span>
          </div>

        </div>
        <div style="display:flex;justify-content:space-between;padding:0 2px">
          <div style="text-align:center;flex:1">
            <div style="font-size:10px;color:var(--muted)">Příjmy</div>
            <div style="font-size:13px;font-weight:600;color:var(--green)">+${fmt(aInc)}</div>
          </div>
          <div style="text-align:center;flex:1">
            <div style="font-size:10px;color:var(--muted)">Výdaje</div>
            <div style="font-size:13px;font-weight:600;color:var(--red)">−${fmt(aExp)}</div>
          </div>
          <div style="text-align:center;flex:1">
            <div style="font-size:10px;color:var(--muted)">Bilance</div>
            <div style="font-size:13px;font-weight:600" class="${aBil>=0?'pos':'neg'}">${aBil>=0?'+':''}${fmt(aBil)}</div>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  h+=`<div class="card">
    <div class="card-title">Výdaje – ${MONTHS[m]}</div>
    <div class="chart-wrap"><canvas id="dayChart"></canvas></div>
  </div>`;

  if(catRows.length){
    h+=`<div class="card" onclick="openPie()" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">Kategorie</div>
        <span style="font-size:12px;color:var(--blue)">🥧 koláč</span>
      </div>`;
    catRows.forEach(({cat,sum})=>{
      const pct=exp>0?Math.min(100,(sum/exp)*100):0;
      h+=`<div class="cat-row"><div class="cat-row-top"><span>${cat.icon} ${cat.name}</span><span style="font-weight:700;color:var(--red)">${fmt(sum)}</span></div><div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div></div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div style="text-align:center;color:var(--muted);padding:20px;font-size:14px">Žádné záznamy v tomto měsíci</div>`;
  }
  return h;
}

function renderChart(){
  const canvas=document.getElementById('dayChart');
  if(!canvas)return;
  if(chart){chart.destroy();chart=null;}
  const m=selMonth, y=selYear;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const days=[];
  for(let d=1;d<=daysInMonth;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sum=transactions.filter(t=>t.date===key&&t.type==='vydaj').reduce((s,t)=>s+t.amount,0);
    days.push({label:`${d}.`,sum});
  }
  chart=new Chart(canvas,{
    type:'bar',
    data:{labels:days.map(d=>d.label),datasets:[{data:days.map(d=>d.sum),backgroundColor:'#EF5350cc',borderRadius:3,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:8},maxRotation:0,autoSkip:false,callback:(val,i)=>(i%2===0?days[i].label:'')}},y:{grid:{color:'#f0f0f0'},ticks:{font:{size:10},callback:v=>v===0?'0':v>=1000?(v/1000).toFixed(0)+'k':v}}}}
  });
}

let pieChart=null;
function openPie(){
  const m=selMonth, y=selYear;
  const mTx=transactions.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y&&t.type==='vydaj';});
  const catMap={};
  mTx.forEach(t=>{catMap[t.categoryId]=(catMap[t.categoryId]||0)+t.amount;});
  const rows=Object.entries(catMap).map(([id,sum])=>({cat:categories.find(c=>c.id===id),sum})).filter(r=>r.cat).sort((a,b)=>b.sum-a.sum);
  if(!rows.length)return;

  document.getElementById('pie-title').textContent=`Výdaje – ${MONTHS[m]} ${y}`;
  document.getElementById('m-pie').classList.add('open');

  setTimeout(()=>{
    const canvas=document.getElementById('pieChart');
    if(!canvas)return;
    if(pieChart){pieChart.destroy();pieChart=null;}
    canvas.style.display='block';
    pieChart=new Chart(canvas,{
      type:'doughnut',
      data:{
        labels:rows.map(r=>r.cat.name),
        datasets:[{data:rows.map(r=>r.sum),backgroundColor:rows.map(r=>r.cat.color),borderWidth:2,borderColor:'#fff'}]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fmt(c.raw)} (${Math.round(c.raw/rows.reduce((s,r)=>s+r.sum,0)*100)}%)`}}}}
    });
    // legenda
    document.getElementById('pie-legend').innerHTML=rows.map(r=>`
      <div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <div style="width:10px;height:10px;border-radius:2px;background:${r.cat.color};flex-shrink:0"></div>
        <span style="color:var(--muted)">${r.cat.icon} ${r.cat.name}</span>
        <span style="font-weight:700;margin-left:auto">${fmt(r.sum)}</span>
      </div>`).join('');
  },150);
}


  const tot=accounts.reduce((s,a)=>s+(a.balance||0),0);
  let h=`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <span style="color:var(--muted)">Celkový zůstatek</span>
    <span style="font-weight:700;font-size:17px" class="${tot>=0?'pos':'neg'}">${fmt(tot)}</span>
  </div>`;
  accounts.forEach(a=>{
    const aTx=transactions.filter(t=>t.accountId===a.id);
    const hasTx=aTx.length>0;
    h+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:14px;height:14px;border-radius:50%;background:${a.color}"></div>
          <span style="font-weight:700;font-size:16px">${a.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:18px" class="${(a.balance||0)>=0?'pos':'neg'}">${fmt(a.balance||0)}</span>
          ${!hasTx?`<button onclick="deleteAcc('${a.id}')" style="background:none;border:1px solid #ffcdd2;color:var(--red);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">Smazat</button>`:''}
        </div>
      </div>`;
    if(aTx.length){
      h+=`<div style="border-top:1px solid #f0f0f0;padding-top:8px">`;
      aTx.slice(0,20).forEach(t=>{
        const cat=categories.find(c=>c.id===t.categoryId);
        h+=`<div onclick="openEdit('${t.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #fafafa;cursor:pointer">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">${t.type==='prijem'?'💰':cat?.icon||'📦'}</span>
            <div>
              <div style="font-size:13px;font-weight:600">${t.type==='prijem'?'Příjem':cat?.name||'Ostatní'}</div>
              <div style="font-size:11px;color:var(--muted)">${t.date}${t.note?' · '+t.note:''}</div>
            </div>
          </div>
          <span style="font-weight:700;font-size:14px" class="${t.type==='prijem'?'pos':'neg'}">${t.type==='prijem'?'+':'−'}${fmt(t.amount)}</span>
        </div>`;
      });
      if(aTx.length>20) h+=`<div style="text-align:center;font-size:12px;color:var(--muted);padding:6px">+ dalších ${aTx.length-20} záznamů</div>`;
      h+=`</div>`;
    } else {
      h+=`<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px 0">Zatím žádné záznamy</div>`;
    }
    h+=`</div>`;
  });
  h+=`<button class="btn-add" onclick="document.getElementById('m-acc').classList.add('open')">+ Přidat účet</button>`;
  return h;
}

async function deleteAcc(id){
  if(!confirm('Smazat tento účet?'))return;
  await db.collection('accounts').doc(id).delete();
  toast('Účet smazán');
}

function vTx(){
  if(!transactions.length)return`<div class="empty">Zatím žádné záznamy.<br>Stiskni + pro přidání.</div>`;
  return transactions.map(t=>{
    const acc=accounts.find(a=>a.id===t.accountId);
    const cat=categories.find(c=>c.id===t.categoryId);
    return`<div class="tx-item" onclick="openEdit('${t.id}')" style="cursor:pointer">
      <div style="display:flex;align-items:center;min-width:0">
        <div class="tx-icon">${t.type==='prijem'?'💰':cat?.icon||'📦'}</div>
        <div style="min-width:0">
          <div class="tx-name">${t.type==='prijem'?'Příjem':cat?.name||'Ostatní'}</div>
          <div class="tx-sub">${acc?.name||''}${t.note?' · '+t.note:''} · ${t.date}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="tx-amount ${t.type==='prijem'?'pos':'neg'}">${t.type==='prijem'?'+':'−'}${fmt(t.amount)}</div>
        <button onclick="event.stopPropagation();deleteTx('${t.id}','${t.accountId}',${t.amount},'${t.type}')" style="background:none;border:none;cursor:pointer;font-size:16px;color:#ddd;padding:2px">✕</button>
      </div>
    </div>`;
  }).join('');
}

async function deleteTx(id, accountId, amount, type){
  if(!confirm('Smazat tento záznam?'))return;
  await db.collection('transactions').doc(id).delete();
  const delta = type==='prijem' ? -amount : amount;
  await db.collection('accounts').doc(accountId).update({balance: firebase.firestore.FieldValue.increment(delta)});
  toast('Záznam smazán');
}

function vKat(){
  let h=`<div class="cat-grid">`;
  categories.forEach(c=>{
    const inUse=transactions.some(t=>t.categoryId===c.id);
    h+=`<div class="cat-card">
      <div class="cat-card-icon">${c.icon}</div>
      <div><div class="cat-card-name">${c.name}</div><div class="cat-accent" style="background:${c.color}"></div></div>
      ${!inUse?`<button class="del-btn" onclick="deleteCat('${c.id}')">✕</button>`:''}
    </div>`;
  });
  h+=`</div><button class="btn-add" onclick="document.getElementById('m-cat').classList.add('open')">+ Přidat kategorii</button>`;
  return h;
}

async function deleteCat(id){
  if(!confirm('Smazat tuto kategorii?'))return;
  await db.collection('categories').doc(id).delete();
  toast('Kategorie smazána');
}

function vNastaveni(){
  let h=`<div class="card"><div class="card-title">Jména účtů</div>`;
  accounts.forEach(a=>{
    h+=`<div class="setting-row">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:11px;height:11px;border-radius:50%;background:${a.color}"></div>
        <span style="font-weight:600;font-size:14px">${a.name}</span>
      </div>
      <input class="setting-input" value="${a.name}" onchange="renameAcc('${a.id}',this.value)">
    </div>`;
  });
  h+=`</div>
  <div class="card"><div class="card-title">Přidat na plochu (Android)</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px">V Chrome: klikni na menu ⋮ → <strong>Přidat na plochu</strong> nebo <strong>Nainstalovat aplikaci</strong>.</p>
    <p style="font-size:13px;color:var(--muted);line-height:1.7">Na iPhone: klikni na sdílet 📤 → <strong>Přidat na plochu</strong>.</p>
  </div>
  <div class="card"><div class="card-title">O aplikaci</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.7">Data jsou uložena v cloudu a sdílená v reálném čase.</p>
  </div>`;
  return h;
}

async function renameAcc(id,name){
  if(!name.trim())return;
  await db.collection('accounts').doc(id).update({name:name.trim()});
  toast('Jméno uloženo');
}

function openAdd(preselectAccId){
  document.getElementById('m-tx-title').textContent='Nová transakce';
  document.getElementById('f-edit-id').value='';
  document.getElementById('f-acc').innerHTML=accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('f-cat').innerHTML=categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('f-amt').value='';
  document.getElementById('f-note').value='';
  if(preselectAccId) document.getElementById('f-acc').value=preselectAccId;
  setType('vydaj');
  document.getElementById('m-tx').classList.add('open');
}

function openEdit(txId){
  const t=transactions.find(x=>x.id===txId);
  if(!t)return;
  document.getElementById('m-tx-title').textContent='Upravit záznam';
  document.getElementById('f-edit-id').value=t.id;
  document.getElementById('f-edit-old-acc').value=t.accountId;
  document.getElementById('f-edit-old-amt').value=t.amount;
  document.getElementById('f-edit-old-type').value=t.type;
  document.getElementById('f-acc').innerHTML=accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('f-cat').innerHTML=categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  document.getElementById('f-acc').value=t.accountId;
  document.getElementById('f-cat').value=t.categoryId||'';
  document.getElementById('f-date').value=t.date;
  document.getElementById('f-amt').value=t.amount;
  document.getElementById('f-note').value=t.note||'';
  setType(t.type);
  document.getElementById('m-tx').classList.add('open');
}

function closeM(id){document.getElementById(id).classList.remove('open');}

function setType(t){
  txType=t;
  document.getElementById('btn-v').classList.toggle('active',t==='vydaj');
  document.getElementById('btn-p').classList.toggle('active',t==='prijem');
  document.getElementById('f-cat').style.display=t==='prijem'?'none':'block';
}

async function saveTx(){
  const amount=parseFloat(document.getElementById('f-amt').value);
  if(!amount||isNaN(amount)){toast('Zadej částku');return;}
  const accountId=document.getElementById('f-acc').value;
  const categoryId=txType==='vydaj'?document.getElementById('f-cat').value:'';
  const date=document.getElementById('f-date').value;
  const note=document.getElementById('f-note').value.trim();
  const type=txType;
  const editId=document.getElementById('f-edit-id').value;
  closeM('m-tx');

  if(editId){
    // Editace – vrátit starou hodnotu, zapsat novou
    const oldAcc=document.getElementById('f-edit-old-acc').value;
    const oldAmt=parseFloat(document.getElementById('f-edit-old-amt').value);
    const oldType=document.getElementById('f-edit-old-type').value;
    toast('Záznam upraven ✓');
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('transactions').doc(editId).update({type,amount,accountId,categoryId,date,note,updatedAt:ts});
    // Vrátit starou změnu na původním účtu
    const revert=oldType==='prijem'?-oldAmt:oldAmt;
    db.collection('accounts').doc(oldAcc).update({balance:firebase.firestore.FieldValue.increment(revert)});
    // Přidat novou změnu na novém účtu
    const delta=type==='prijem'?amount:-amount;
    db.collection('accounts').doc(accountId).update({balance:firebase.firestore.FieldValue.increment(delta)});
  } else {
    toast(type==='vydaj'?'Výdaj přidán ✓':'Příjem přidán ✓');
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('transactions').add({type,amount,accountId,categoryId,date,note,createdAt:ts});
    const delta=type==='prijem'?amount:-amount;
    db.collection('accounts').doc(accountId).update({balance:firebase.firestore.FieldValue.increment(delta)});
  }
}

async function saveCat(){
  const icon=document.getElementById('c-icon').value.trim()||'💰';
  const name=document.getElementById('c-name').value.trim();
  if(!name){toast('Zadej název');return;}
  await db.collection('categories').add({name,icon,color:CAT_COLORS[categories.length%CAT_COLORS.length],createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  closeM('m-cat');
  document.getElementById('c-icon').value='';
  document.getElementById('c-name').value='';
  toast('Kategorie přidána ✓');
}

async function saveAcc(){
  const name=document.getElementById('a-name').value.trim();
  if(!name){toast('Zadej jméno');return;}
  closeM('m-acc');
  toast('Účet přidán ✓');
  document.getElementById('a-name').value='';
  db.collection('accounts').add({name,color:ACC_COLORS[accounts.length%ACC_COLORS.length],balance:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}

document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));

// Swipe mezi záložkami
const VIEWS=['prehled','ucty','transakce','kategorie','nastaveni'];
let swipeX=0, swipeY=0;
document.getElementById('content').addEventListener('touchstart',e=>{
  swipeX=e.touches[0].clientX;
  swipeY=e.touches[0].clientY;
},{passive:true});
document.getElementById('content').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-swipeX;
  const dy=e.changedTouches[0].clientY-swipeY;
  if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return; // příliš krátký nebo vertikální
  const idx=VIEWS.indexOf(view);
  if(dx<0&&idx<VIEWS.length-1){
    const btn=document.querySelectorAll('.nav button')[idx+1];
    go(VIEWS[idx+1],btn);
  } else if(dx>0&&idx>0){
    const btn=document.querySelectorAll('.nav button')[idx-1];
    go(VIEWS[idx-1],btn);
  }
},{passive:true});

const now=new Date();
document.getElementById('hdr-month').textContent=`${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
init();
</script>
